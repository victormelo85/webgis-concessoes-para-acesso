const encryptedPayload=JSON.parse(document.getElementById('encrypted-payload').textContent);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const login=document.getElementById('login-screen'),analysis=document.getElementById('analysis-screen'),frame=document.getElementById('analysis-frame');
document.getElementById('login-form').onsubmit=async function(e){e.preventDefault();const submit=document.getElementById('submit'),error=document.getElementById('error');error.textContent='';submit.disabled=true;submit.textContent='Abrindo…';
try{if(!window.crypto?.subtle)throw new Error('secure-context');const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const raw=new TextEncoder().encode(JSON.stringify([username,password]));const material=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encryptedPayload.salt),iterations:encryptedPayload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encryptedPayload.iv),tagLength:128},key,bytes(encryptedPayload.ciphertext));frame.srcdoc=new TextDecoder().decode(plain);document.getElementById('password').value='';login.hidden=true;analysis.hidden=false;document.title='WebGIS de concessões do Pará';}
catch(err){error.textContent=err.message==='secure-context'?'Abra esta página pelo endereço HTTPS para acessar.':'Login ou senha incorretos.';}
finally{submit.disabled=false;submit.textContent='Entrar';}};
document.getElementById('logout').onclick=function(){frame.srcdoc='';frame.removeAttribute('srcdoc');analysis.hidden=true;login.hidden=false;document.getElementById('password').value='';document.getElementById('error').textContent='';document.title='WebGIS de concessões do Pará · Acesso protegido';document.getElementById('username').focus();};
</script></body></html>
